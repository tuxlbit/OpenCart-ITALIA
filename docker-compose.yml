name: opencart-italia

services:
  apache:
    container_name: opencart-italia-apache
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    ports:
      - "${HTTP_EXPOSE_PORT:-8080}:${HTTP_PORT:-80}"
    volumes:
      - .:/var/www
    depends_on:
      php:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - opencart

  php:
    container_name: opencart-italia-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        - PHP_VERSION=${PHP_VERSION:-8.4}
        - PHP_UNAME=${PHP_UNAME:-www-data}
        - PHP_UID=${PHP_UID:-33}
    environment:
      - TZ=${TZ:-Europe/Rome}
      - AUTO_INSTALL=${AUTO_INSTALL:-1}
      - OPENCART_LANGUAGE=${OPENCART_LANGUAGE:-it-it}
      - OPENCART_USERNAME=${OPENCART_USERNAME:-admin}
      - OPENCART_PASSWORD=${OPENCART_PASSWORD:-admin123}
      - OPENCART_ADMIN_EMAIL=${OPENCART_ADMIN_EMAIL:-admin@example.com}
      - OPENCART_HTTP_SERVER=${OPENCART_HTTP_SERVER:-http://localhost:8080/}
      - DB_DRIVER=${DB_DRIVER:-mysqli}
      - DB_HOSTNAME=${DB_HOSTNAME:-mysql}
      - DB_USERNAME=${DB_USERNAME:-opencart}
      - DB_PASSWORD=${DB_PASSWORD:-opencart}
      - DB_DATABASE=${DB_DATABASE:-opencart}
      - DB_PORT=${DB_PORT:-3306}
      - DB_PREFIX=${DB_PREFIX:-oc_}
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - opencart

  mysql:
    container_name: opencart-italia-mysql
    image: mariadb:11.4
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --max_allowed_packet=64M
    ports:
      - "${DB_EXPOSE_PORT:-3307}:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-opencart}
      - MARIADB_DATABASE=${DB_DATABASE:-opencart}
      - MARIADB_USER=${DB_USERNAME:-opencart}
      - MARIADB_PASSWORD=${DB_PASSWORD:-opencart}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - opencart

  adminer:
    container_name: opencart-italia-adminer
    image: adminer:latest
    profiles: [adminer]
    ports:
      - "${ADMINER_EXPOSE_PORT:-8081}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - opencart

  redis:
    container_name: opencart-italia-redis
    image: redis:latest
    profiles: [redis]
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - opencart

  memcached:
    container_name: opencart-italia-memcached
    image: memcached:latest
    profiles: [memcached]
    ports:
      - "${MEMCACHED_EXPOSE_PORT:-11211}:11211"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - opencart

volumes:
  mysql-data:
  redis-data:

networks:
  opencart:
    driver: bridge
    name: opencart-italia-network
