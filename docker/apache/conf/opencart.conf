# Impostazioni per OpenCart ITALIA

# I file di configurazione del negozio non vanno mai serviti
<Files ~ "config\.php$">
    Require all denied
</Files>

# Nessun file nascosto (.git, .env, .htaccess...)
<Files ~ "^\.">
    Require all denied
</Files>

# Cartelle di sviluppo presenti nel repository ma non nel negozio
<DirectoryMatch "/var/www/(docker|dist|\.github|\.git)">
    Require all denied
</DirectoryMatch>

# Documentazione del progetto
<FilesMatch "\.(md|sh|yml|yaml|lock)$">
    Require all denied
</FilesMatch>
