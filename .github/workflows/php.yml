name: Verifica

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  sintassi:
    name: Sintassi PHP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3" ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, curl, openssl, zip, mbstring
          coverage: none

      - name: Controllo sintassi di tutti i file PHP
        run: |
          find admin catalog extension install system -name '*.php' \
            -not -path 'system/storage/vendor/*' -print0 \
            | xargs -0 -P 4 -n 1 php -l > /dev/null

  installazione:
    name: Installazione su MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: opencart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, gd, curl, openssl, zip, mbstring
          coverage: none

      - name: Prepara i file di configurazione
        run: |
          : > config.php
          : > admin/config.php
          chmod 666 config.php admin/config.php

      - name: Installa OpenCart in italiano
        run: |
          php install/cli_install.php install \
            --username    admin \
            --password    admin123 \
            --email       verifica@example.com \
            --http_server http://localhost/ \
            --language    it-it \
            --db_driver   mysqli \
            --db_hostname 127.0.0.1 \
            --db_username root \
            --db_password root \
            --db_database opencart \
            --db_port     3306 \
            --db_prefix   oc_

      - name: Controlla i dati italiani nel database
        run: |
          mysql -h 127.0.0.1 -uroot -proot opencart -e "
            SELECT code, locale FROM oc_language;
            SELECT name, rate, type FROM oc_tax_rate;
            SELECT g.name, z.country_id FROM oc_geo_zone g
              JOIN oc_zone_to_geo_zone z ON z.geo_zone_id = g.geo_zone_id;
            SELECT \`key\`, value FROM oc_setting
              WHERE \`key\` IN ('config_language_admin','config_currency','config_country_id','config_zone_id');
            SELECT COUNT(*) AS paesi FROM oc_country;
            SELECT COUNT(*) AS zone FROM oc_zone;
          "
