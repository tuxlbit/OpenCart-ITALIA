name: Semgrep PHP Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Analyze PHP with Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.173.0

      - name: Run Semgrep
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          baseline_args=()
          if [[ -n "$BASELINE_COMMIT" ]]; then
            baseline_args+=(--baseline-commit "$BASELINE_COMMIT" --error)
          fi

          semgrep scan . \
            --config p/php \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            --metrics=off \
            --exclude .git \
            --exclude dist \
            --exclude image/cache \
            --exclude system/storage/vendor \
            "${baseline_args[@]}"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: ${{ always() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: semgrep.sarif
